name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shell's build script requires the sidecars to exist; CI stages
      # placeholders (real node binaries come from scripts/build-node-binaries.sh).
      - name: Stage placeholder sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          for n in lattice lattice-node; do printf '#!/bin/sh\nexit 1\n' > "src-tauri/binaries/$n-$triple"; chmod +x "src-tauri/binaries/$n-$triple"; done
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles app --no-sign
