name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shell's build script requires the sidecars to exist; CI stages
      # placeholders (real node binaries come from scripts/build-node-binaries.sh).
      - name: Stage placeholder sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          for n in lattice lattice-node; do printf '#!/bin/sh\nexit 1\n' > "src-tauri/binaries/$n-$triple"; chmod +x "src-tauri/binaries/$n-$triple"; done
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles app --no-sign

  # The headless e2e against REAL node binaries: lattice, lattice-node and
  # lattice-mining-coordinator built (debug, as bundled) at NODE_COMMIT, and
  # the app bundled with them, launched.
  e2e:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - id: node
        run: echo "commit=$(tr -d '[:space:]' < NODE_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: adalinxx/lattice-node
          ref: ${{ steps.node.outputs.commit }}
          path: .build-node
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build-node/.build
          key: node-debug-macos-${{ steps.node.outputs.commit }}
          restore-keys: node-debug-macos-
      - name: Build node binaries at NODE_COMMIT
        working-directory: .build-node
        run: |
          for product in lattice lattice-node lattice-mining-coordinator; do
            swift build -c debug --product "$product"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # The app as shipped: the real node binaries as its sidecars.
      - name: Stage the node binaries as sidecars
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          for n in lattice lattice-node; do install -m 0755 ".build-node/.build/debug/$n" "src-tauri/binaries/$n-$triple"; done
      - run: npx tauri build --bundles app --no-sign
      - name: Headless e2e (real node, no peers, throwaway storage) and the packaged app
        run: |
          LATTICE_NODE_BIN="$PWD/.build-node/.build/debug" \
          LATTICE_APP="$PWD/src-tauri/target/release/bundle/macos/Lattice.app" \
          npm test
