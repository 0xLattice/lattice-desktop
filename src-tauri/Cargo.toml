[package]
name = "lattice-desktop"
version = "0.1.0"
description = "Lattice Desktop: a full Lattice node and the Nexus Wallet"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "lattice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
base64 = "0.22"
