[package]
name = "lattice-desktop"
version = "0.1.2"
description = "Lattice Desktop: a full Lattice node and the Nexus Wallet"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "lattice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
base64 = "0.22"
# The buyer's swap engine (lattice-swap's native `swap::app`), pinned by its
# commit, and the Nexus it names by default. `bitcoin` is the version it uses.
swap = { git = "https://github.com/0xLattice/lattice-swap", rev = "f745f87d77a84f9cf1532d7d43d22284c30f257b" }
swap-nexus-tx = { git = "https://github.com/0xLattice/lattice-swap", rev = "f745f87d77a84f9cf1532d7d43d22284c30f257b" }
bitcoin = { version = "0.32", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Holds the Dock's Quit (see `background::terminate`); the version tao uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
# Signs an offer for the relay listing's test.
ed25519-dalek = "2"
