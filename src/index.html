<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lattice</title>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <header class="bar">
    <button id="settings-button" class="brand" type="button" title="Settings" aria-label="Open settings">
      <img src="assets/lattice-mark.svg" width="18" height="18" alt="" />
    </button>
    <span class="chain-controls">
      <button id="parent-chain" class="net parent-chain" type="button" hidden>↑</button>
      <button id="net-badge" class="net" type="button" title="Show child chains">Nexus</button>
    </span>
  </header>
  <main id="view"></main>
  <script type="module" src="main.js"></script>
</body>
</html>
